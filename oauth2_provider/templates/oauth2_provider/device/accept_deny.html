{% extends "oauth2_provider/base.html" %}
{% block content %}
<html>
<head>
    <title>Accept or Deny</title>
</head>
<body>
    <h1>{{ application.name }} requests access to the following scopes:</h1>
    <ul>
        {% for scope in scopes_descriptions %}
            <li>{{ scope }}</li>
        {% endfor %}
    </ul>
    <form method="post">
        {% csrf_token %}
        <button type="submit" name="action" value="accept">Accept</button>
        <button type="submit" name="action" value="deny">Deny</button>
    </form>
    <form method="post" action="{% url 'oauth2_provider:device-cancel' client_id=view.kwargs.client_id user_code=view.kwargs.user_code %}">
        {% csrf_token %}
        <button type="submit">Cancel</button>
    </form>
</body>
</html>
{% endblock content %}
